name: Claude PR Review
# Revue désactivée par défaut : aucun déclenchement automatique sur les PR.
# Relance ponctuelle : Actions > « Claude PR Review » > Run workflow, avec le
# numéro de la pull request à relire.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de la pull request à relire
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request (#${{ inputs.pr_number }}).
            Focus on bugs, security issues, missing tests, and unclear code.
            Be concise. Post inline comments on specific lines and a short
            summary comment at the end. Don't comment on style that the
            linter already enforces.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
