[project]
name = "demo-live-avis"
version = "0.1.0"
description = "Démo live : enquête de satisfaction vocale (STT local + Jev + SQLite + Streamlit)"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1",
  "av>=11,<19",  # av 19 a retiré `metadata_errors`, utilisé par faster-whisper 1.2.1 (decode_audio)
  "sounddevice>=0.5",
  "numpy>=1.26",
  "streamlit>=1.40",
  "pydeck>=0.9",
  "altair>=5",
  "pandas>=2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
