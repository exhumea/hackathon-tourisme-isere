[project]
name = "hackathon-dge-gestion-des-flux"
version = "0.1.0"
description = "Scripts Python pour le hackathon DGE de gestion des flux touristiques"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium",
    "geopandas",
    "matplotlib",
    "numpy",
    "openpyxl",
    "osmnx",
    "pandas",
    "pyarrow",
    "requests",
    "urllib3",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyarrow-stubs>=20.0.0.20260819",
    "shapely",
    "types-requests>=2.33.0.20261030",
    "types-geopandas>=1.2.0.20261107",
    "types-shapely>=2.1.0.20261030",
]

[tool.uv]
package = false

[tool.deptry.per_rule_ignores]
# openpyxl est chargé dynamiquement par pandas via engine="openpyxl".
DEP002 = ["openpyxl"]

[tool.importlinter]
root_packages = ["isere_tourism"]

[[tool.importlinter.contracts]]
name = "Les modules isere_tourism sont indépendants"
type = "independence"
modules = ["isere_tourism.*"]
