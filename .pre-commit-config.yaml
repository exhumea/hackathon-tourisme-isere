default_install_hook_types: [pre-commit, pre-push]

exclude: |
  (?x)^(
    vendor/|
    generated/|
    .*\.min\.js$|
    .*\.lock$|
    .*\.(docx|pptx|pdf|xlsx|zip|gz)$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/mprpic/mdlint
    rev: 0.4.0
    hooks:
      - id: mdlint
        args: [--config, .mdlint.toml]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync --all-packages mypy
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --no-sync --all-packages pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
