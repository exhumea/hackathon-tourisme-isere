[project]
name = "hackathon-dge-tooling"
version = "0.1.0"
description = "Outillage qualité du dépôt hackathon DGE gestion des flux touristiques"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=2",
    "pre-commit>=4.3",
    "mdlint>=0.4.0",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.16",
    "shellcheck-py>=0.11",
    "yamllint>=1.37",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["datasets/sources_py"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "sbx-kits-contrib", "datasets/sources_r", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
strict = true
exclude = ["^sbx-kits-contrib/", "^datasets/sources_r/", "^data/"]
warn_unused_ignores = true
warn_unused_configs = true

#[tool.pytest.ini_options]
